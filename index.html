<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peasant Smith · Apps</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
        background: radial-gradient(circle at 20% 10%, #1c1530 0%, #0b0c0f 55%);
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        text-align: center;
      }
      h1 { font-size: 1.1rem; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.55); margin-bottom: 8px; }
      p.tag { color: rgba(255,255,255,0.4); font-size: 0.9rem; margin-bottom: 32px; }
      .grid { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; max-width: 720px; }
      .card {
        display: block; text-decoration: none; color: #fff;
        padding: 24px 28px; border-radius: 18px; min-width: 240px;
        background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12);
        transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      }
      .card:hover { transform: translateY(-3px); border-color: rgba(139,92,246,0.6); background: rgba(255,255,255,0.07); }
      .card .name { font-size: 1.15rem; font-weight: 700; margin-bottom: 6px; }
      .card .desc { font-size: 0.82rem; color: rgba(255,255,255,0.55); }
      .card .url { font-size: 0.75rem; color: rgba(139,92,246,0.9); margin-top: 12px; font-family: ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <h1>Peasant Smith Apps</h1>
    <p class="tag">A growing collection of small, fun web apps.</p>
    <div class="grid">
      <a class="card" href="./llm-profile/" style="border-left: 3px solid #8b5cf6;">
        <div class="name">My Inner AI Personality</div>
        <div class="desc">Discover which AI parameters better suit your personality.</div>
        <div class="url">/peasant-smith/llm-profile/</div>
      </a>
      <a class="card" href="./voxel-paris/" style="border-left: 3px solid #7df3ff;">
        <div class="name">Voxel Paris</div>
        <div class="desc">La Tour sous les étoiles — a hand-laid voxel Paris garden & city at night.</div>
        <div class="url">/peasant-smith/voxel-paris/</div>
      </a>
    </div>
  </body>
</html>
