name: Validate Data

on:
  pull_request:
    paths: ['benchmarks/**', 'data/**']
  push:
    branches: ['main']
    paths: ['benchmarks/**', 'data/**']

permissions:
  contents: read
  pull-requests: write

jobs:
  schema-validation:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: pip install jsonschema>=4.20
        
      - name: Validate JSON benchmarks against schema v1.1
        run: |
          python3 scripts/validation/validate_benchmark.py benchmarks/examples/*.json benchmarks/raw/*.json

      - name: Validate CSV databases
        run: |
          python3 scripts/validation/validate_csv.py

      - name: Recompute PS Points + leaderboard (must be in sync)
        run: |
          python3 scripts/score/compute_score.py leaderboard --csv data/benchmarks.csv
          git diff --exit-code LEADERBOARD.md
