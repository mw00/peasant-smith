name: Deploy AI Personality to Pages

on:
  push:
    branches: [main]
    paths: ['projects/my-inner-ai-personality/**', 'index.html']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the app
        working-directory: projects/my-inner-ai-personality
        run: |
          npm ci
          npm run build
      - name: Stage the site (app at /llm-profile/ + hub at root)
        run: |
          mkdir -p _site/llm-profile
          cp -r projects/my-inner-ai-personality/dist/* _site/llm-profile/
          cp index.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
